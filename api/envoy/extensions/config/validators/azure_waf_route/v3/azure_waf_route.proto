syntax = "proto3";

package envoy.extensions.config.validators.azure_waf_route.v3;

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.config.validators.azure_waf_route.v3";
option java_outer_classname = "AzureWafRouteProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/config/validators/azure_waf_route/v3;azure_waf_routev3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: azure waf route]
// [#extension: envoy.config.validators.azure_waf_route]

// Validates RDS config, and ensures that WAF has all the referenced WAF policies in route resources.
message AzureWafRouteValidator {
  // The address of the waf grpc server used for config validation.
  string waf_address = 1;

  // Grpc request timeout in milliseconds
  google.protobuf.Duration request_timeout = 2;
}

syntax = "proto3";

package envoy.extensions.config.validators.azure_waf_listener.v3;

import "google/protobuf/duration.proto";

import "udpa/annotations/status.proto";

option java_package = "io.envoyproxy.envoy.extensions.config.validators.azure_waf_listener.v3";
option java_outer_classname = "AzureWafListenerProto";
option java_multiple_files = true;
option go_package = "github.com/envoyproxy/go-control-plane/envoy/extensions/config/validators/azure_waf_listener/v3;azure_waf_listenerv3";
option (udpa.annotations.file_status).package_version_status = ACTIVE;

// [#protodoc-title: azure waf listener]
// [#extension: envoy.config.validators.azure_waf_listener]

// Validates LDS config, and ensures that WAF has all the policies that are referenced in listener resources.
message AzureWafListenerValidator {
  // The address of the waf grpc server used for config validation.
  string waf_address = 1;

  // Grpc request timeout in milliseconds
  google.protobuf.Duration request_timeout = 2;
}

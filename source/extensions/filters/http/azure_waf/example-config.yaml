dynamic_resources:
  ads_config:
    api_type: GRPC
    transport_api_version: V3
    config_validators:
      - name: envoy.config.validators.azure_waf_listener
        typed_config:
          "@type": type.googleapis.com/xds.type.v3.TypedStruct
          type_url: envoy.extensions.config.validators.azure_waf_listener.v3.AzureWafListenerValidator
          value:
            waf_address: "127.0.0.1:8201"
            request_timeout: 0.05s
      - name: envoy.config.validators.azure_waf_route
        typed_config:
          "@type": type.googleapis.com/xds.type.v3.TypedStruct
          type_url: envoy.extensions.config.validators.azure_waf_route.v3.AzureWafRouteValidator
          value:
            waf_address: "127.0.0.1:8201"
            request_timeout: 0.05s
    grpc_services:
    - envoy_grpc:
        cluster_name: xds_cluster
        authority: localhost
  lds_config:
    resource_api_version: V3
    ads: {}
  cds_config:
    resource_api_version: V3
    ads: {}
static_resources:
  listeners:
    - name: listener_0
      # This needs to be set when WAF is enabled to limit the buffer size.
      # TODO: Check if this impacts customer in any way.
      per_connection_buffer_limit_bytes: 131072
      address:
        socket_address: { address: 0.0.0.0, port_value: 80 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: auto
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: local_service
                            max_grpc_timeout: 10s
                          typed_per_filter_config:
                            # Per route WAF config.
                            # This overrides the configid, policyid, scopename and scope set at listener level.
                            envoy.filters.http.azure_waf:
                              "@type": type.googleapis.com/waf.PerRoutePolicyConfig
                              configid: "3#policy2"
                              policyid: "policy2"
                              scopename: "route"
                              scope: "local_route"
                http_filters:
                    # Waf filter needs configid, policyid, scopename, scope and a grpc_service to connect to waf service and evaluate a request
                  - name: waf
                    typed_config:
                      "@type": type.googleapis.com/waf.PolicyConfig
                      configid: "wafhash#policy1"
                      policyid: "policy1"
                      scopename: "Global"
                      scope: "Global"
                      grpc_service:
                        # grpc_service can either be envoy_grpc or google_grpc.
                        # TODO: Evaluate whether to use envoy_grpc or google_grpc.
                        envoy_grpc:
                          cluster_name: waf_service
                    # When WAF is enabled, file system buffer is needed to buffer the complete request before passing it to the backend.
                    # WAF needs to read the complete request before it can evaluate whether the request needs to be allowed or blocked.
                  - name: file_system_buffer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.file_system_buffer.v3.FileSystemBufferFilterConfig
                      manager_config:
                        thread_pool:
                          # Num of concurrent threads that can be used by the async file writer to write request contents to disk.
                          thread_count: 1
                      # Storage path is used to specify the location on the disk where the request is written.
                      storage_buffer_path: "/tmp"
                      request:
                        # Specifies the limit per request that can held in memory before writing to disk.
                        memory_buffer_bytes_limit: 131072
                        # Specifies the limit per request that can be written to disk.
                        storage_buffer_bytes_limit: 6000000000
                        # The maximum num of bytes per request that can be queued for writing to storage.
                        storage_buffer_queue_high_watermark_bytes: 40000
                        # Setting the behavior to fully_buffer, buffers the request fully before sending it to backend.
                        behavior:
                          fully_buffer: {}
                      response:
                        # Setting the behavior to bypass, allows the response to pass through this filter without any buffering.
                        behavior:
                          bypass: {}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: local_service
      connect_timeout: 0.25s
      type: strict_dns
      lb_policy: round_robin
      load_assignment:
        cluster_name: local_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 8080
    - name: waf_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      connect_timeout: 5s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              initial_connection_window_size: 65536
              initial_stream_window_size: 65536
      load_assignment:
        cluster_name: waf_service
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: 127.0.0.1
                  port_value: 37291
      per_connection_buffer_limit_bytes: 131072